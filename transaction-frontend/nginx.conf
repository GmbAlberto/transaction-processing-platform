server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las solicitudes /api se envían a transaction-api
    location /api/ {
        proxy_pass http://transaction-api:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Evita cachear el index porque referencia los archivos generados por Vite
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Los assets generados por Vite contienen hash y sí pueden cachearse
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}